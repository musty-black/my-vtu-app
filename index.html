<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My VTU App - UBA Transfer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1763">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f0f3ff;padding-bottom:90px}
.header{background:#0a1763;color:white;padding:18px 20px;display:flex;justify-content:space-between}
.balance-card{background:white;color:#0a1763;margin:16px 20px;padding:20px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.balance-card h2{font-size:36px;margin:6px 0}
.btn{background:#e8ecff;border:none;padding:16px;border-radius:14px;font-weight:600;cursor:pointer}
.btn-primary{background:#0a1763;color:white;padding:18px;font-size:16px;border:none;border-radius:14px;width:calc(100% - 40px);margin:14px 20px}
.card{background:white;margin:14px 20px;padding:16px;border-radius:14px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:100;padding:20px}
.modal.active{display:flex}
.modal-box{background:white;width:100%;max-width:400px;border-radius:18px;padding:22px}
input,select{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
.bank-box{background:#f0f3ff;border:2px dashed #0a1763;padding:14px;border-radius:12px;margin:10px 0}
.small{font-size:12px;color:#666}
</style>
</head>
<body>
<div class="header"><b>Musty VTU</b><span>Mustapha</span></div>
<div class="balance-card"><p>Wallet Balance</p><h2 id="bal">₦ 0.00</h2><p class="small">UBA - Mustapha Mubarak - 2370760036</p></div>
<button class="btn-primary" onclick="openModal('fundModal')">+ Fund Wallet - UBA Transfer</button>
<div class="card"><b>Transactions</b><div id="trans"></div></div>
<div class="modal" id="fundModal"><div class="modal-box">
<h3>Fund via UBA Transfer</h3>
<div class="bank-box">
<p>Bank: <b>UBA</b></p>
<p>Name: <b>Mustapha Mubarak</b></p>
<p>Number: <b style="font-size:22px">2370760036</b></p>
<button onclick="navigator.clipboard.writeText('2370760036');alert('Copied 2370760036')" style="width:100%;margin-top:10px;background:#0a1763;color:white;padding:12px;border:none;border-radius:10px">Copy Account Number</button>
</div>
<input type="number" id="bankAmount" placeholder="Amount you sent e.g 1000">
<button onclick="confirmBank()" style="width:100%;background:#0a1763;color:white;padding:14px;border:none;border-radius:12px;font-weight:600">I Have Transferred - Credit Me</button>
<button style="width:100%;margin-top:10px;padding:12px;border:none;border-radius:10px" onclick="closeModal('fundModal')">Close</button>
</div></div>
<script>
let balance=parseInt(localStorage.getItem('vtu_bal')||'0');
let txs=JSON.parse(localStorage.getItem('vtu_txs')||'[]');
document.getElementById('bal').innerText='₦ '+balance.toLocaleString()+'.00';
function openModal(id){document.getElementById(id).classList.add('active')}
function closeModal(id){document.getElementById(id).classList.remove('active')}
function confirmBank(){
let amt=parseInt(document.getElementById('bankAmount').value);
if(!amt||amt<100){alert('Enter amount');return}
balance+=amt;localStorage.setItem('vtu_bal',balance);
document.getElementById('bal').innerText='₦ '+balance.toLocaleString()+'.00';
txs.unshift({type:'Funding - UBA 2370760036',amount:amt,date:new Date().toLocaleString()});
localStorage.setItem('vtu_txs',JSON.stringify(txs));
alert('₦'+amt+' credited for Mustapha Mubarak UBA');
closeModal('fundModal');location.reload();
}
</script>
</body>
 </html>
