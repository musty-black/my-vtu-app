<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MustyPay - Mustapha Mubarak</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f1f4f9;padding-bottom:80px}
.header{background:#0a1931;color:white;padding:18px 16px 28px;border-radius:0 0 26px 26px}
.top{display:flex;justify-content:space-between;align-items:center}
.left{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;background:white;color:#0a1931;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
.bal-right{text-align:right}.bal-right b{font-size:22px;display:block}
.card{background:white;border-radius:20px;padding:16px;margin:12px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.availRow{display:flex;justify-content:space-between;align-items:center}
.adminBadge{background:#111;color:white;padding:6px 14px;border-radius:18px;font-size:11px;font-weight:800}
.amount{font-size:42px;font-weight:900;margin:10px 0}
.btnRow{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:14px;border-radius:14px;border:0;font-weight:800}
.btnDark{background:#0a1931;color:white}.btnLight{background:#eef2ff;color:#0a1931;border:1.5px solid #d0d8f0}
.ubaBox{background:linear-gradient(135deg,#0a1931,#1e3a7a);border-radius:18px;padding:18px;text-align:center;color:white;margin-top:12px}
.ubaNum{font-size:30px;font-weight:900;margin:6px 0;letter-spacing:1px}.ubaName{font-size:14px;margin-bottom:12px}
.copyBtn{background:white;color:#0a1931;border:0;padding:10px 20px;border-radius:12px;font-weight:800}
.input,select{width:100%;padding:14px;border:1.5px solid #ddd;border-radius:12px;margin:6px 0}
.payBtn{width:100%;padding:14px;background:#0a1931;color:white;border:0;border-radius:12px;font-weight:800;margin-top:8px}
.tag{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.pending{background:#fff3cd;color:#856404}.success{background:#d4edda;color:#155724}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0 8px;border-top:1px solid #e5e5e5;z-index:10}
.b-item{text-align:center;font-size:11px;color:#666;font-weight:600;cursor:pointer;padding:6px 16px;border-radius:14px}
.b-item.active{background:#eef2ff;color:#0a1931}
.serviceGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.s-btn{background:#eef2ff;border-radius:16px;padding:16px 6px;text-align:center;font-weight:700;font-size:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}
.s-btn span{font-size:22px}.settingsItem{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #f0f0f0}
.settingsItem b{font-size:14px}.settingsItem small{color:#888;font-size:12px}
.hidden{display:none}
</style>
</head>
<body>
