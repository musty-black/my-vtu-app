<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My VTU App</title>
<style>
body{font-family:sans-serif;background:#f5f7ff;margin:0;padding:0}
.header{background:#0d1b5e;color:white;padding:20px;text-align:center;border-radius:0 0 25px 25px}
.card{background:white;margin:15px;padding:15px;border-radius:15px;box-shadow:0 2px 10px #00000020}
.balance{font-size:28px;font-weight:bold;color:#0d1b5e}
.btn{background:#0d1b5e;color:white;border:0;padding:12px;width:100%;border-radius:10px;font-size:16px;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid div{background:#eef2ff;padding:20px;text-align:center;border-radius:12px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h2>My VTU App 🇳🇬</h2>
<p>Welcome, Musty!</p>
<div class="balance">₦ 5,250.00</div>
<small>Wallet Balance</small>
</div>

<div class="card">
<div class="grid">
<div>📱 Airtime</div>
<div>📶 Data</div>
<div>📺 TV Sub</div>
<div>💡 Electricity</div>
</div>
<button class="btn">Fund Wallet</button>
</div>

<div class="card">
<h3>Recent Transactions</h3>
<p>✅ MTN 2GB - ₦600 - Success</p>
<p>✅ Airtel Airtime ₦500 - Success</p>
<p>✅ GLO 5GB - ₦1400 - Success</p>
</div>
</body>
  </html>
