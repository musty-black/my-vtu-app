<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musty VTU - Nigeria</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f0f4f9;margin:0;padding:10px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.btn{background:#0a3d8f;color:#fff;border:0;padding:12px;border-radius:10px;width:100%;font-weight:bold;margin-top:8px}
.btn-g{background:#0a7a0a}.btn-r{background:#c0392b}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0}
.row{display:flex;gap:8px}.row>*{flex:1}
.tag{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.pending{background:#fff3cd;color:#856404}.success{background:#d4edda;color:#155724}.failed{background:#f8d7da;color:#721c24}
.small{font-size:12px;color:#666}
</style>
</head>
<body>
<div class="card" style="display:flex;justify-content:space-between;align-items:center;background:#0a3d8f;color:white">
<div><div class="small" style="color:#cdd9f0">Wallet Balance</div><div style="font-size:26px;font-weight:900" id="bal">₦0.00</div></div>
<button onclick="fund()" style="background:white;color:#0a3d8f;border:0;padding:10px 14px;border-radius:10px;font-weight:bold">+ Fund</button>
</div>
<div class="card">
<h3>Buy Airtime</h3>
<div class="row">
<select id="net"><option>MTN</option><option>GLO</option><option>AIRTEL</option><option>9MOBILE</option></select>
<input id="phone" placeholder="080...">
</div>
<input id="amt" type="number" placeholder="Amount e.g 100">
<button class="btn" onclick="buyAirtime()">Buy Airtime Now</button>
</div>
<div class="card">
<h3>Buy Data</h3>
<select id="datanet" onchange="loadPlans()"><option>MTN</option><option>GLO</option><option>AIRTEL</option><option>9MOBILE</option></select>
<select id="dataplan"></select>
<input id="dataphone" placeholder="Phone number">
<button class="btn" style="background:#0a7a0a" onclick="buyData()">Buy Data Now</button>
</div>
<div class="card">
<h3>Transaction History</h3>
<div id="history"></div>
</div>
<div class="card" style="border:2px dashed #0a3d8f">
<h3>ADMIN PANEL</h3>
<input id="adminPin" type="password" placeholder="PIN = 2025">
<button class="btn" onclick="unlockAdmin()">Unlock Admin</button>
<div id="adminArea" style="display:none">
<h4>Pending Funding Requests</h4>
<div id="pendingList"></div>
</div>
</div>
<script>
const plans={MTN:[{label:"500MB - ₦150",amt:150},{label:"1GB - ₦270",amt:270},{label:"2GB - ₦540",amt:540}],GLO:[{label:"1GB - ₦300",amt:300},{label:"2.5GB - ₦600",amt:600}],AIRTEL:[{label:"1GB - ₦300",amt:300},{label:"2GB - ₦600",amt:600}],"9MOBILE":[{label:"1GB - ₦400",amt:400}]};
let walletBalance=parseFloat(localStorage.getItem('wallet')||'0');
let transactions=JSON.parse(localStorage.getItem('transactions')||'[]');
let pendingFundings=JSON.parse(localStorage.getItem('pendingFundings')||'[]');
function save(){localStorage.setItem('wallet',walletBalance);localStorage.setItem('transactions',JSON.stringify(transactions));localStorage.setItem('pendingFundings',JSON.stringify(pendingFundings));render();}
function loadPlans(){let net=document.getElementById('datanet').value;let sel=document.getElementById('dataplan');sel.innerHTML='';plans[net].forEach((p,i)=>{sel.innerHTML+=`<option value="${i}">${p.label}</option>`});}
loadPlans();

 document.getElementById('bal').innerText='₦'+walletBalance.toFixed(2);
