<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MustyPay</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f1f4f9;padding-bottom:90px}.header{background:#0a1931;color:#fff;padding:18px;border-radius:0 0 20px 20px}.card{background:#fff;border-radius:16px;padding:14px;margin:12px}.amount{font-size:32px;font-weight:900}.input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin:6px 0}.payBtn{width:100%;padding:12px;background:#0a1931;color:#fff;border:0;border-radius:10px;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ddd}.b-item{text-align:center;font-size:11px;padding:6px 14px;border-radius:12px;cursor:pointer}.b-item.active{background:#0a1931;color:#fff}.hidden{display:none}.dot{position:absolute;top:0;right:5px;background:red;color:#fff;width:16px;height:16px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center}</style>
</head><body>
<div class="header"><b>MustyPay</b> - <span id="tb">₦0.00</span></div>
<div id="p-home">
<div class="card"><div class="amount" id="ab">₦0.00</div><p>Wallet Balance</p></div>
<div class="card"><b>UBA - 2370760036 - MUSTAPHA MUBARAK</b><br><br><input id="fAmt" class="input" type="number" placeholder="Amount sent"><button class="payBtn" onclick="fund()">I Have Paid</button></div>
</div>
<div id="p-history" class="hidden"><div class="card"><h3>History</h3><div id="his"></div></div></div>
<div id="p-settings" class="hidden"><div class="card"><h3>Settings</h3><div onclick="secretTap()" style="padding:12px 0;border-bottom:1px solid #eee"><b>👤 MUSTAPHA MUBARAK</b><br><small>App v2.1 Secured</small> <span id="pendCount" style="background:red;color:white;padding:2px 8px;border-radius:10px" class="hidden">0</span></div><div id="aB" class="hidden" style="margin-top:10px;padding:10px;background:#f0f0f0;border-radius:10px"><input id="aP" type="password" class="input" placeholder="Code"><button class="payBtn" onclick="unlock()">Unlock</button><div id="aA" class="hidden"><div id="pL"></div><button class="payBtn" style="background:red;margin-top:10px" onclick="clearAll()">RESET</button></div></div></div></div>
<div id="p-services" class="hidden"><div class="card"><h3>Services - <span id="wb2">₦0.00</span></h3><button class="payBtn" onclick="buy()">Buy 50 Demo</button></div></div>
<div class="bottom"><div class="b-item active" id="n-home" onclick="showP('home')">Home</div><div class="b-item" id="n-services" onclick="showP('services')">Services</div><div class="b-item" id="n-history" onclick="showP('history')">History</div><div class="b-item" id="n-settings" onclick="showP('settings')">Settings <span id="dot" class="dot hidden">!</span></div></div>
<script>
let w=parseFloat(localStorage.getItem('musty_wallet')||0),tx=JSON.parse(localStorage.getItem('musty_tx')||'[]'),pd=JSON.parse(localStorage.getItem('musty_pending')||'[]'),taps=0;
function sv(){localStorage.setItem('musty_wallet',w);localStorage.setItem('musty_tx',JSON.stringify(tx));localStorage.setItem('musty_pending',JSON.stringify(pd));rend()}
function rend(){let b='₦'+w.toFixed(2);document.getElementById('tb').innerText=b;document.getElementById('ab').innerText=b;document.getElementById('wb2').innerText=b;let h=tx.length==0?'No tx':'';[...tx].reverse().forEach(x=>{h+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><div><b>${x.t}</b> ₦${x.a}<br><small>${x.d}</small></div><small>${x.s}</small></div>`});document.getElementById('his').innerHTML=h;let p='';if(pd.length==0){p='No pending';document.getElementById('dot').classList.add('hidden');document.getElementById('pendCount').classList.add('hidden')}else{pd.forEach((f,i)=>{p+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd"><div><b>₦${f.a}</b><br><small>${f.d}</small></div><div><button style="padding:6px 10px;background:green;color:white;border:0;border-radius:6px" onclick="ap(${i})">Approve</button> <button style="padding:6px 10px;background:red;color:white;border:0;border-radius:6px" onclick="rj(${i})">Reject</button></div></div>`});document.getElementById('dot').classList.remove('hidden');document.getElementById('dot').innerText=pd.length;document.getElementById('pendCount').classList.remove('hidden');document.getElementById('pendCount').innerText=pd.length;}document.getElementById('pL').innerHTML=p}
function showP(p){['home','services','history','settings'].forEach(x=>{document.getElementById('p-'+x).classList.add('hidden');document.getElementById('n-'+x).classList.remove('active')});document.getElementById('p-'+p).classList.remove('hidden');document.getElementById('n-'+p).classList.add('active');rend()}
function fund(){let a=parseFloat(document.getElementById('fAmt').value);if(!a)return alert('Enter amount');let d=new Date().toLocaleString();pd.push({a:a,d:d});tx.push({t:'FUNDING',a:a,d:d,s:'Pending'});sv();alert('Pending - Admin go check UBA');}
function ap(i){let f=pd[i];w+=f.a;for(let j=tx.length-1;j>=0;j--){if(tx[j].a==f.a&&tx[j].s=='Pending'){tx[j].s='Success';break}}pd.splice(i,1);sv()}
function rj(i){let f=pd[i];for(let j=tx.length-1;j>=0;j--){if(tx[j].a==f.a&&tx[j].s=='Pending'){tx[j].s='Rejected';break}}pd.splice(i,1);sv()}
function secretTap(){taps++;if(taps>=5){document.getElementById('aB').classList.remove('hidden');taps=0}setTimeout(()=>taps=0,3000)}
function unlock(){if(document.getElementById('aP').value=='2025'){document.getElementById('aA').classList.remove('hidden');rend()}else alert('Wrong')}
function buy(){if(w<50)return alert('Low');w-=50;tx.push({t:'AIRTIME',a:50,d:new Date().toLocaleString(),s:'Success'});sv()}
function clearAll(){if(prompt('DELETE')=='DELETE'){w=0;tx=[];pd=[];sv()}}
rend();
</script></body></html>
