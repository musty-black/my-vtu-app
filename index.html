<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width'><title>Musty VTU Manual</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f4f4f5;padding-bottom:90px}.header{background:#00b386;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.card{background:white;margin:12px;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}.balance{font-size:28px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center}.grid div{background:white;padding:12px;border-radius:14px;cursor:pointer}.grid span{font-size:24px;display:block}.btn{background:#00b386;color:white;border:none;padding:14px;width:100%;border-radius:12px;font-weight:700;font-size:16px;margin-top:10px}.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:8px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee}.bottom div{text-align:center;font-size:12px;cursor:pointer}.pending{background:#fff7ed;border-left:4px solid orange;padding:12px;margin:8px 0;border-radius:10px}.delivered{background:#f0fdf4;border-left:4px solid green;padding:12px;margin:8px 0;border-radius:10px}</style></head
